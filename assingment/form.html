<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <label for="Full Name">Full Name</label>
    <input type="text"id="Full Name">
<br>
    <label for="Email">Email</label>
    <input type="email" id="Email">
<br>
    <label for="Phone Number">Phone Number</label>
    <input type="tel" id="Phone Number">
<br>
    <label for="Password">Password</label>
    <input type="password"id="Password">
<br>
    <label for="Confirm Password">Confirm Password</label>
    <input type="password"id="Confirm Password">
<br>
    <label for="Date of Birth">DoB</label>
    <input type="date"id="Date of Birth">
<br>
    <label for="Photo Upload">Photo Upload</label>
    <input type="file"id="Photo Upload">
<br>
    <label for="Gender">Gender</label>
    <input type="Gender"  id="Gender">
<br>
    <label for="Country">Country</label>
    <input type="Dropdown"id="Country">
<br>
    <label for="About Yourself">About Yourself</label>
    <input type="text" id="About Yourself">
    <!-- <select name="" id=""></select> -->
<br>
    <button>Register </button>
</body>
</html>
