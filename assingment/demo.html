<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<form>
   <h1>Registration Form</h1><br>
   <label for="Name">Name:</label>
   <input type="text" id="Name"><br>

   <label for="Father's Name">Father's Name:</label>
   <input type="text" id="FatherName"><br>

   <label for="Mother's Name ">Mother's Name:</label>
   <input type="text"  id="MotherName"><br>

   <label for="DoB">DoB:</label>
   <input type="date"  id="DoB"><br>

   <label for="Branch">Branch:</label>
   <select name="" id="Branch">
    <option value="CSE">CSE</option>
    <option value="Mechanical">Mechanical</option>
    <option value="Electrical">Electrical</option>
   </select><br>

   <label for="Gender">Gender</label>
   <input type="radio" name="Gender" id="Male">
   <label for="Male">Male</label>
   <input type="radio"name="Gender" id="Female">
   <label for="Female">Female</label>
   <br>

   <label for="Phone Number">Phone Number:</label>
   <input type="tel" id="Phone Number"><br>

   <label for="Address">Address:</label>
   <input type="text" name="Address" id="Address"> <br>

   <label for="About Yourself"> About Yourself :</label>
  
  <textarea name="About Yourself" id="About Yourself"></textarea> <br>

  <label for="To">Terms & conditions</label>
  <input type="checkbox" name="To" id="To">
   <button>Submit</button>
</form>
</body>
</html>
